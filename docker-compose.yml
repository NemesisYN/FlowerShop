services:
  api:
    build: .
    ports:
      - "8070:8070"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:S3crtKfiJ4@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8070"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=S3crtKfiJ4
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: